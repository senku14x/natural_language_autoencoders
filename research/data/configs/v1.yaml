# Counterfactual Difference NLA v1 — full dataset config.
# Reproducible from this file + seed. tokenizer.revision MUST be an explicit
# commit SHA (the pipeline refuses to run with a placeholder).

seed: 20260718

tokenizer:
  model_id: Qwen/Qwen2.5-7B-Instruct
  revision: a09a35458c702b33eeacc393d103063234e8bc28
  # local_path: offline access mechanism (hub egress blocked in this
  # container). Excluded from config_hash; file sha256s recorded in manifest.
  # On a hub-connected machine, delete this line to fetch at the pinned SHA.
  local_path: research/data/tokenizer/qwen25

preamble:
  min_final_pos: 52   # read site must clear the released AV's _MIN_POSITION=50

holdout:
  colors: 4               # test_value pool (never seen anywhere in train)
  color_transitions: 12   # unordered pairs held out among train colors
  nonces: 5               # test_entity pool
  names: 10               # test_name pool (complete held-out canonical names)
  name_transitions: 15    # unordered pairs held out among train names

strata:
  S:
    templates: [s1, s2, s3]
    context_templates: [s4]
    families:
      train: 450
      dev: 60
      test_context: 60
      test_transition: 60
      test_value: 60
      test_entity: 60
  N:
    templates: [n1, n2, n3]
    context_templates: [n4]
    families:
      train: 300
      dev: 40
      test_context: 40
      test_transition: 40
      test_name: 40

cells:
  null_aa_semantic:   # semantic NULL_AA pairs per stratum (x8 variant rows)
    S: 20
    N: 10

out_dir: research/data/out/v1
